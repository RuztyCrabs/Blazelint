name: Bump Version

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  bump:
    runs-on: ubuntu-latest
    container:
      image: rust:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install toml-cli
        run: cargo install toml-cli

      - name: Get current version
        id: current_version
        run: |
          VERSION=$(toml get Cargo.toml package.version --raw)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      - name: Calculate new version
        id: new_version
        run: |
          CURRENT="${{ steps.current_version.outputs.version }}"
          MAJOR=$(echo $CURRENT | cut -d. -f1)
          MINOR=$(echo $CURRENT | cut -d. -f2)
          PATCH=$(echo $CURRENT | cut -d. -f3)
          
          case "${{ inputs.bump_type }}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac
          
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"

      - name: Update Cargo.toml version
        run: |
          toml set Cargo.toml package.version "${{ steps.new_version.outputs.version }}" > Cargo.toml.tmp
          mv Cargo.toml.tmp Cargo.toml

      - name: Update Cargo.lock
        run: cargo check

      - name: Verify tag doesn't exist
        id: check_tag
        run: |
          git fetch --tags
          if git rev-parse "v${{ steps.new_version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "⚠️ Tag v${{ steps.new_version.outputs.version }} already exists. Please use a different version bump."
            exit 1
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "✅ Tag v${{ steps.new_version.outputs.version }} is available"
          fi

      - name: Create version bump branch
        run: |
          BRANCH="version-bump/${{ steps.new_version.outputs.version }}"
          git checkout -b "$BRANCH"
          git add Cargo.toml Cargo.lock
          git commit -m "chore: bump version to ${{ steps.new_version.outputs.version }}"
          git push origin "$BRANCH"

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "chore: bump version to ${{ steps.new_version.outputs.version }}" \
            --body "Automated version bump to **${{ steps.new_version.outputs.version }}**

          This PR was created by the version bump workflow.
          
          **After merging**, a tag will be created automatically and the release workflow will be triggered.
          
          - Bump type: **${{ inputs.bump_type }}**
          - New version: **v${{ steps.new_version.outputs.version }}**" \
            --label "release" \
            --base main \
            --head "version-bump/${{ steps.new_version.outputs.version }}"
