name: Publish crate

permissions:
  contents: write

on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    container:
      image: rust:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-cargo-

      - name: Install toml-cli
        run: cargo install toml-cli

      - name: Install Typst
        uses: typst-community/setup-typst@v4
        with:
          typst-version: latest

      - name: Verify tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(toml get Cargo.toml package.version --raw)" = "${{ github.ref_name }}"

      - name: "Preflight: fmt, clippy, tests"
        run: |
          rustup component add rustfmt clippy
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-features

      - name: Build release binary
        run: cargo build --locked --release

      - name: Package release binary
        run: |
          install -d dist
          cp target/release/blazelint dist/blazelint
          tar -C dist -czf dist/blazelint-${{ github.ref_name }}-x86_64-linux-gnu.tar.gz blazelint
          sha256sum dist/blazelint-${{ github.ref_name }}-x86_64-linux-gnu.tar.gz > dist/blazelint-${{ github.ref_name }}.sha256
          rm dist/blazelint

      - name: Compile SRS PDF
        run: |
          install -d dist
          typst compile docs/SRS.typ dist/BlazeLint-SRS.pdf

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: BlazeLint ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/blazelint-${{ github.ref_name }}-x86_64-linux-gnu.tar.gz
            dist/blazelint-${{ github.ref_name }}.sha256
            dist/BlazeLint-SRS.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean release artifacts
        run: rm -rf dist

      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish --locked
